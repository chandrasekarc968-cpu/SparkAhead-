# ==============================================================================
# VELTRAXX'26 PS02 — AXI4-Lite Arbiter CI Pipeline
# ==============================================================================
# Runs on: push/PR to main
# Jobs: lint (iverilog), sim (directed 43+ tests), sim-stress (10K random),
#       formal (SymbiYosys BMC depth 25), synth (Yosys generic)
# ==============================================================================

name: AXI4-Lite Arbiter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run lint
        run: |
          iverilog -g2012 -Wall -o /dev/null \
            src/rtl/axi4lite_pkg.sv \
            src/rtl/axi4lite_address_decoder.sv \
            src/rtl/axi4lite_qos_scheduler.sv \
            src/rtl/axi4lite_response_router.sv \
            src/rtl/axi4lite_write_arbiter.sv \
            src/rtl/axi4lite_read_arbiter.sv \
            src/rtl/axi4lite_arbiter_top.sv

  sim:
    name: Directed Regression (43+ tests)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile
        run: |
          mkdir -p build
          iverilog -g2012 -Wall -o build/tb_directed.vvp \
            src/rtl/axi4lite_pkg.sv \
            src/rtl/axi4lite_address_decoder.sv \
            src/rtl/axi4lite_qos_scheduler.sv \
            src/rtl/axi4lite_response_router.sv \
            src/rtl/axi4lite_write_arbiter.sv \
            src/rtl/axi4lite_read_arbiter.sv \
            src/rtl/axi4lite_arbiter_top.sv \
            tb/sim/tb_axi4lite_arbiter.sv
      - name: Run directed tests
        run: vvp build/tb_directed.vvp
      - name: Upload VCD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directed-waveform
          path: "*.vcd"
          retention-days: 7

  sim-stress:
    name: Stress Regression (10K transactions)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile
        run: |
          mkdir -p build
          iverilog -g2012 -Wall -o build/tb_stress.vvp \
            src/rtl/axi4lite_pkg.sv \
            src/rtl/axi4lite_address_decoder.sv \
            src/rtl/axi4lite_qos_scheduler.sv \
            src/rtl/axi4lite_response_router.sv \
            src/rtl/axi4lite_write_arbiter.sv \
            src/rtl/axi4lite_read_arbiter.sv \
            src/rtl/axi4lite_arbiter_top.sv \
            tb/sim/tb_axi4lite_stress.sv
      - name: Run stress test
        run: vvp build/tb_stress.vvp
      - name: Upload VCD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-waveform
          path: "*.vcd"
          retention-days: 7

  formal:
    name: Formal Verification (SymbiYosys)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite
        run: |
          wget -q https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2024-04-25/oss-cad-suite-linux-x64-20240425.tgz -O oss-cad-suite.tgz || true
          if [ -f oss-cad-suite.tgz ]; then
            tar xzf oss-cad-suite.tgz
            echo "$PWD/oss-cad-suite/bin" >> $GITHUB_PATH
          else
            echo "WARNING: Could not download OSS CAD Suite, skipping formal"
            exit 0
          fi
      - name: Run SymbiYosys
        run: |
          if command -v sby &>/dev/null; then
            sby -f formal/arbiter.sby
          else
            echo "SKIPPED: sby not available"
          fi

  synth:
    name: Synthesis Check (Yosys)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Run synthesis
        run: |
          yosys -p "
            read_verilog -sv \
              src/rtl/axi4lite_pkg.sv \
              src/rtl/axi4lite_address_decoder.sv \
              src/rtl/axi4lite_qos_scheduler.sv \
              src/rtl/axi4lite_response_router.sv \
              src/rtl/axi4lite_write_arbiter.sv \
              src/rtl/axi4lite_read_arbiter.sv \
              src/rtl/axi4lite_arbiter_top.sv;
            synth -top axi4lite_arbiter_top;
            stat;
            write_verilog build/synth_netlist.v
          " 2>&1 | tee build/synth.log
      - name: Check for errors
        run: |
          if grep -q "ERROR" build/synth.log; then
            echo "Synthesis errors detected!"
            exit 1
          fi
          echo "Synthesis completed successfully"
      - name: Upload netlist
        uses: actions/upload-artifact@v4
        with:
          name: synth-netlist
          path: build/
          retention-days: 14
